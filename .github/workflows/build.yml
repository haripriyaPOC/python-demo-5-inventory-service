name: Python Application Build and Kubernetes Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:

    runs-on: [self-hosted, Linux, X64]

    steps:

      # Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4


      # Login to Docker Hub
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/python5-backend:v1 .

      # Push Docker Image
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/python5-backend:v1

      - name: Diagnose Kubernetes API Connectivity
        run: |
          echo "Checking network routes..."
          ip route

          echo "Checking Kubernetes API port..."
          nc -vz -w 5 172.31.30.220 6443

          echo "Checking Kubernetes API readiness endpoint..."
          curl -k -v --connect-timeout 5 \
            https://172.31.30.220:6443/readyz

      - name: Configure Kubernetes
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          

          mkdir -p "$HOME/.kube"
          printf '%s\n' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

          echo "Validating Kubernetes configuration..."
          kubectl config current-context

          echo "Checking Kubernetes cluster access..."
          kubectl get nodes

          echo "Deploying application..."
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
